<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="app-container">
        <div class="display">
            <div class="result-section">
                <output id="result">45</output>
            </div>
            <div class="input-section">
                <span id="input">39 + 6</span>
            </div>
        </div>
        <div class="button-container">
            <button class="btn btn-orange"> AC </button>
            <button class="btn btn-orange"> C </button>
            <button class="btn"> % </button>
            <button class="btn"> X </button>

            <button class="btn" value="1"> 1 </button>
            <button class="btn" value="2"> 2 </button>
            <button class="btn" value="2"> 3</button>
            <button class="btn" value="3"> / </button>

            <button class="btn" value="4"> 4 </button>
            <button class="btn" value="5"> 5 </button>
            <button class="btn" value="6"> 6 </button>
            <button class="btn" value="-"> - </button>

            <button class="btn" value="7"> 7 </button>
            <button class="btn" value="8"> 8 </button>
            <button class="btn" value="9"> 9 </button>
            <button class="btn" value="+"> + </button>

            <button class="btn" value="true"> + / - </button>
            <button class="btn" value="0"> 0 </button>
            <button class="btn" value="."> . </button>
            <button class="btn btn-red" value="="> = </button>
        </div>
    </div>
</body>
</html>
