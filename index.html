<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="app-container">
        <div class="display">
            <div class="input-output-section">
                <span id="input-output"> </span>
            </div>
            <div class="sub-result-section">
                <span id="sub-result"> </span>
            </div>
        </div>
        <div class="button-container">
            <button type="button" class="btn btn-orange" data-action="clear-all"> AC </button>
            <button type="button" class="btn" data-op="x²"> x² </button>
            <button type="button" class="btn" data-op="%"> % </button>
            <button type="button" class="btn" data-op="x"> X </button>

            <button type="button" class="btn" data-num="1"> 1 </button>
            <button type="button" class="btn" data-num="2"> 2 </button>
            <button type="button" class="btn" data-num="3"> 3</button>
            <button type="button" class="btn" data-op="/"> / </button>

            <button type="button" class="btn" data-num="4"> 4 </button>
            <button type="button" class="btn" data-num="5"> 5 </button>
            <button type="button" class="btn" data-num="6"> 6 </button>
            <button type="button" class="btn" data-op="-"> - </button>

            <button type="button" class="btn" data-num="7"> 7 </button>
            <button type="button" class="btn" data-num="8"> 8 </button>
            <button type="button" class="btn" data-num="9"> 9 </button>
            <button type="button" class="btn" data-op="+"> + </button>

            <button type="button" class="btn" data-num="0"> 0 </button>
            <button type="button" class="btn" data-op="."> . </button>
            <button type="button" class="btn btn-orange" data-action="backspace"> C </button>
            <button type="button" class="btn btn-red" data-action="calculate"> = </button>
        </div>
    </div>
</body>
</html>
